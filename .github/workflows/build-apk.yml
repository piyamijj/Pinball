name: Build APK
on:
  push:
    branches: [main, master]
  release:
    types: [published]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: android-actions/setup-android@v3
      - run: npm install
      - run: npm run build
      - name: Android platformu ekle (yoksa)
        run: '[ -d android ] || npx cap add android'
      - run: npx cap sync android
      - name: APK derle
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - name: APK adını düzenle
        run: cp android/app/build/outputs/apk/debug/app-debug.apk gotik-konak-pinball.apk
      - uses: actions/upload-artifact@v4
        with: { name: gotik-konak-pinball-apk, path: gotik-konak-pinball.apk }
      - name: GitHub Release'e yükle
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'release' && github.event.release.tag_name || format('build-{0}', github.run_number) }}
          name: ${{ github.event_name == 'release' && github.event.release.name || format('APK build {0}', github.run_number) }}
          files: gotik-konak-pinball.apk
